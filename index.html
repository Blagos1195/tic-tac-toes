<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="shell">
    <div class="page-heading">
      <h1>Tic Tac Toe</h1>
      <span class="top-note"><span class="status-dot"></span><span id="model-status">Loading AI...</span></span>
    </div>
    <section class="game-card" aria-label="Tic Tac Toe game">
      <div class="mode-picker" role="group" aria-label="Game mode">
        <button class="mode-button active" data-mode="ai" aria-pressed="true">Player vs AI</button>
        <button class="mode-button" data-mode="pvp" aria-pressed="false">Player vs Player</button>
      </div>
      <div class="game-layout">
        <section class="board-column">
          <div class="board-heading">
            <div>
              <p class="eyebrow" id="round-label">YOUR TURN</p>
              <h2 id="game-status" aria-live="polite">Choose your first move.</h2>
            </div>
            <span class="turn-pill" id="turn-pill"><span class="turn-symbol">X</span> <span id="turn-label">YOUR MOVE</span></span>
          </div>
          <div class="board" id="board" role="group" aria-label="Tic Tac Toe board">
            <button class="cell" data-cell="0" aria-label="Top left, empty"></button>
            <button class="cell" data-cell="1" aria-label="Top middle, empty"></button>
            <button class="cell" data-cell="2" aria-label="Top right, empty"></button>
            <button class="cell" data-cell="3" aria-label="Middle left, empty"></button>
            <button class="cell" data-cell="4" aria-label="Centre, empty"></button>
            <button class="cell" data-cell="5" aria-label="Middle right, empty"></button>
            <button class="cell" data-cell="6" aria-label="Bottom left, empty"></button>
            <button class="cell" data-cell="7" aria-label="Bottom middle, empty"></button>
            <button class="cell" data-cell="8" aria-label="Bottom right, empty"></button>
          </div>
          <div class="board-footer">
            <span><i class="legend-x">X</i> Player 1</span>
            <span><i class="legend-o">O</i> <span id="opponent-name">Trained AI</span></span>
          </div>
        </section>
        <aside class="side-panel">
          <h2>Score</h2>
          <div class="score-row">
            <div class="score-box">
              <span class="score-symbol x-text" id="score-you-symbol">X</span>
              <span class="score-number" id="score-x">0</span>
              <span class="score-name" id="score-x-name">YOU</span>
            </div>
            <div class="score-divider"></div>
            <div class="score-box">
              <span class="score-symbol o-text" id="score-opponent-symbol">O</span>
              <span class="score-number" id="score-o">0</span>
              <span class="score-name" id="score-o-name">AI</span>
            </div>
          </div>
          <div class="draw-count"><span>Draws</span><b id="score-draw">0</b></div>
          <p class="next-copy"><b id="next-title">Your move</b><br><span id="next-copy">You play as X. The trained AI plays as O.</span></p>
          <button class="primary-button" id="new-game">New game</button>
          <button class="text-button" id="reset-scores">Reset scores</button>
        </aside>
      </div>
    </section>
  </main>
</body>
</html>
